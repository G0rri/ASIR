<!DOCTYPE html>
<html>
    <head>
        {% load bootstrap5 %}
        {% bootstrap_css %}
        {% bootstrap_javascript %}
        <title>{{ title }}</title>
    </head> 
    <body>
        <div class="container"></div>
        <form method="POST">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <button type="submit" value="Submit">Save</button>
        </form>
    </body>
</html>
