<!DOCTYPE html>
<html>
    <head>
        {% load bootstrap5 %}
        {% bootstrap_css %}
        {% bootstrap_javascript %}
    </head>
    <body>
        <h1>Courts</h1>
            <table border="1" class="table table-hover">
                <tr><th>Id</th><th>Description</th><th>Court Type</th></tr>
                    {% for x in mycourts %}
                    <tr>
                        <td>{{ x.id }}</td>
                        <td>{{ x.description }}</td>
                        <td>{{ x.court_type }}</td>
                    </tr>
                    {% endfor %}
            </table>
    <p><a href="http://localhost:8000/courts/new">New Court</a></p>
    <p><a href="http://localhost:8000/members">Go to Members</a></p>
    </body>
</html>
