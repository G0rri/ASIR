<!DOCTYPE html>
<html>
    <head>
        <style>
            @keyframes girar {
                from {transform: rotate(0deg);}
                to {transform: rotate(360deg);}
            }

            #cuadrado {
                width: 200px;
                height: 100px;
                background-color: red;
                animation: girar 3s linear forwards;
            }
        </style>
    </head>
    <body>
        <div id="cuadrado"></div>
    </body>
</html>
