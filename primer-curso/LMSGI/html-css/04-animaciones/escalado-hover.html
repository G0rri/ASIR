<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            h1:hover {
                animation: cambiarTamaño 3s linear infinite;
            }

            @keyframes cambiarTamaño {
                0% {transform: scale(1);}
                33% {transform: scale(2);}
                67% {transform: scale(0.25);}
                100% {transform: scale(1);}
            }
        </style>
    </head>
    <body>
        <h1>Esto se va a descontrolar</h1>
    </body>
</html>
