<!DOCTYPE html>
<html> <!-- Pendiente: girar las caras en vertical (rotateX); al probar con el eje Z la cara se duplicaba. -->
    <meta charset="UTF-8"> 
    <head>
        <style>
            .bloque {
                width: 100px;
                height: 65px;
                perspective: 1000px;
                float: left;
                margin-right: 10px;
                box-shadow: 10px 10px 5px grey; 
            }

            .bloque div {
                width: 100%;
                height: 100%;
                position: relative;
                transition: transform 1s;
                transform-style: preserve-3d;
            }

            .bloque:hover div {
                transform: rotateY(90deg);
            }

            .cara {
                position: absolute;
                width: 100%;
                height: 100%;
                backface-visibility: hidden;
            }

            .cara.atras {
                transform: rotateY(180deg);
            }
        </style>
    </head>
    <body>
        <div class="bloque">
            <div class="cara" style="background-color: blue;"></div>
            <div class="cara atras" style="background-color: green;"></div>
        </div>
        <div class="bloque">
            <div class="cara" style="background-color: green;"></div>
            <div class="cara atras" style="background-color: brown;"></div>
        </div>
        <div class="bloque">
            <div class="cara" style="background-color: brown;"></div>
            <div class="cara atras" style="background-color: blue;"></div>
        </div>
    </body>
</html>
