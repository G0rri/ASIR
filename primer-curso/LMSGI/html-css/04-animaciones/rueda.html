<!DOCTYPE html>
<html>
<head>
<style>
@keyframes rodar {
  from {transform: translateX(0) rotate(0);}
  to {transform: translateX(100%) rotate(360deg);}
}

#rueda {
  width: 100px;
  height: 100px;
  background-color: blue;
  border-radius: 50%;
  position: relative;
  animation: rodar 5s linear infinite;
}

#rueda::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 2px;
  height: 50%;
  background-color: white;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div id="rueda"></div>
</body>
</html>
