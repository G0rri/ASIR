<!DOCTYPE html>
<html>
    <head>
        <style>
            @keyframes mover {
                from {margin-left: 0;}
                to {margin-left: 100%;}
            }

            #circulo {
                width: 200px;
                height: 200px;
                background-color: blue;
                border-radius: 50%;
                animation: mover 5s ease-in-out infinite;
            }
        </style>
    </head>
    <body>
        <div id="circulo"></div>
    </body>
</html>
