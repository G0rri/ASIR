    <!DOCTYPE html>
        <html>
            <head>
                <style>
                    table {
                        border-collapse: collapse;
                        width: 100%;
                    }

                    th, td {
                        text-align: left;
                        padding: 8px;
                        border: 1px solid black;
                    }

                    tr:nth-child(even) {background-color: #cf3f3f;}
                    tr:nth-child(odd) {background-color: green;}

                    th {
                        background-color: #4c98af;
                        color: white;
                    }
                </style>
            </head>
            <body>
                <h1>Tabla 1 CSS</h1>
            <table>
                <tr>
                    <th>Cabecera 1</th>
                    <th>Cabecera 2</th> 
                    <th>Cabecera 3</th>
                </tr>
                <tr>
                    <td>Dato 1</td>
                    <td>Dato 2</td>
                    <td>Dato 3</td>
                </tr>
                <tr>
                    <td>Dato 4</td>
                    <td>Dato 5</td>
                    <td>Dato 6</td>
                </tr>
                <tr>
                    <td>Dato 7</td>
                    <td>Dato 8</td>
                    <td>Dato 9</td>
                </tr>
            </table>
            </body>
        </html>
