<!DOCTYPE html>
<html>
    <head>
        <style>
			table, th, td {
			border: 1px solid black;
			border-radius: 10px;
			}
            .transparencia {
                border: rgba(255, 255, 255, 0);
            }    
            .fondo {
                background-color: rgba(223, 24, 24, 0.527);
                background: linear-gradient(45deg, rgb(0, 183, 255) 5%, rgb(245, 192, 255) 60%);
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-position: center;
            }
            .tamaño {
                font-size: x-large;
            }
            .centrado {
                text-align: center;
                margin-left: auto;
                margin-right: auto;
            }
		</style>
        <title>
            'HORARIO'
        </title>
    </head>
    <body class="fondo">
         
            <h1 class="centrado">
                <u> <em> HORARIO 2023-2024 </em></u>
            </h1>
                <table 
                class="transparencia centrado">
                    <tr 
                    class="tamaño">
                        <th>Horas</th>
                        <th>Lunes</th>
                        <th>Martes</th>
                        <th>Miércoles</th>
                        <th>Jueves</th>
                        <th>Viernes</th>
                    </tr>
                    <tr class="centrado">
                        <td>8:00-9:00</td>
                        <td>FHW</td>
                        <td>FHW</td>
                        <td>PADRE</td>
                        <td rowspan="2">IMPSO</td>
                        <td rowspan="2">IMPSO</td>
                    </tr>
                    <tr class="centrado">
                        <td>9:00-10:00</td>
                        <td>LMAR</td>
                        <td>FOL</td>
                        <td rowspan="2">GBD</td>
                    </tr>
                    <tr class="centrado">
                        <td>10:00-11:00</td>
                        <td>FOL</td>
                        <td>GBD</td>
                        <td>GBD</td>
                        <td>FOL</td>
                    </tr>
                    <tr class="centrado">
                        <td>11:00-11:30</td>
                        <td colspan="6"><a href=https://i.blogs.es/addf40/choco/1024_2000.jpg> RECREO</a></td>
                    </tr>
                    <tr class="centrado">
                        <td>11:30-12:30</td>
                        <td>PADRE</td>
                        <td>GBD</td>
                        <td rowspan="2">IMPSO</td>
                        <td>GBD</td>
                        <td>FHW</td>
                    </tr>
                    <tr class="centrado">
                        <td>12:30-1:30</td>
                        <td rowspan="2">IMPSO</td>
                        <td>LMAR</td>
                        <td>LMAR</td>
                        <td rowspan="2">PADRE</td>
                    </tr>
                    <tr class="centrado">
                        <td>1:30-2:30</td>
                        <td>PADRE</td>
                        <td>LMAR</td>
                        <td>PADRE</td>
                    </tr>
                </table>
    </body>
</html>
