<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            body {
                margin: 0;
                font-family: Helvetica, Arial, sans-serif;
            }

            .barra {
                display: flex;
                justify-content: center;
                background-color: #333;
                position: relative;
            }

            .barra a {
                display: block;
                color: #f2f2f2;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }

            .barra a:hover {
                background: #ddd;
                color: black;
            }
        </style>
    </head>
    <body>
        <div class="barra">
            <a>Youtube</a> 
            <a>Twitch</a> 
            <a>Kick</a> 
            <a>Facebook</a> 
        </div>
        <div style="padding:0 50px;">
            <h2>Ejemplo de Menú</h2>
            <p>Puedes hacer click en las secciones de arriba (realmente no puedes).</p>
        </div>
    </body>
</html>
