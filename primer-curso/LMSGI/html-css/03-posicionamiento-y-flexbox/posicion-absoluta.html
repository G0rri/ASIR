<!DOCTYPE html>
    <html lang="es">
        <head>
            <style>
                body {
                    position: absolute;
                    width: 200px;
                    height: 200px;
                }
                .cuadrado {
                    position: absolute;
                    width: 100%;
                    height: 100%;
                }
                .rojo {
                    background-color: red;
                    top: 50px;
                    left: 50px;
                }
                .azul {
                    background-color: blue;
                    top: 100px;
                    left: 100px;
                }
                .verde {
                    background-color: green;
                    top: 150px;
                    left: 150px;
                }
            </style>
        </head>
        <body>
            <div class="cuadrado rojo"></div>
            <div class="cuadrado azul"></div>
            <div class="cuadrado verde"></div>
            </div>
        </body>
    </html>
