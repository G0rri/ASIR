<!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
        <title>Creando una tarjeta en horizontal</title>
        <style>
            body{
	            align-items: center;
	            display: flex;
	            height: 50vh;
	            justify-content: center;
            }
            .tarjeta h2{
	            font-size: 2rem;
	            font-weight: 500;
	            line-height: 1.2;
	            margin-bottom: .5rem;
	            margin-top: 0;
            }
            .tarjeta{
	            border-radius: 20px;
	            box-shadow: 4px 4px 4px 3px #c9c2c2;
	            display: flex;
	            overflow: hidden;
	            width: 800px;
            }
            .tarjeta .izquierda{
	            color: white;
	            padding: 48px;
	            position: relative;
	            width: 65%;
            }
            .tarjeta .izquierda::after{
	            background: #4395ffd1;
	            border-radius: 24px;
	            box-shadow: 3px -2px 13px 0px #525252;
	            content: '';
	            height: 100%;
	            left: 0;
	            position: absolute;
	            top: 0;
	            transform: skew(160deg,0);
	            transform-origin: top left;
	            width: 100%;
	            z-index: -1;
            }
            .tarjeta .derecha{
	            align-items: center;
	            display: flex;
	            flex-direction: column;
	            justify-content: center;
	            padding-right: 12px;
	            width: 35%;
            }

            .tarjeta .info{
	            background: white;
	            border-radius: 5px;
	            display: inline-block;
	            margin-top: 18px;
	            padding: 14px;
            }
            .tarjeta .info{
	            text-decoration: none;
                background: #a02128;
	            color: white;
            }
        </style>
        </head>
        <body>
            <div class="tarjeta">
            <div class="izquierda"> 
                <img width="300px" src="https://cdn.autobild.es/sites/navi.axelspringer.es/public/media/image/2020/09/guia-compra-10-mejores-coches-urbanos-menos-12000-euros-2085861.jpg?tf=640x" alt="muestra">
            </div>
            <div class="derecha">
                <h2 class="titulo">Urban Car</h2>
            <div>
                <p><b>El vehículo familiar con el que encontrar la felicidad absoluta recorriendo carreteras y para disfrutar de la conducción</b></p>
                <p><b>¿A qué esperas? ¡Cómpralo ya!</b></p>
            </div>  
            <div> <a class="info" href="https://www.coches.net/">Más info</a></div>
        </body>
    </html>
