<!DOCTYPE html>
<html lang="es">
    <head>
        <style>
            html {
                font-family: Arial, sans-serif;
                font-size: 14px;
            }

            .tarjeta {
                box-shadow: 0 0 4px 4px lightgray;
                max-width: 230px; 
                margin: auto;
            }

            .tarjeta .titulo {
                background-color: gray;
                color: white;
                padding: 8px;
                text-align: center;
                font-size: 1.5rem;
            }

            .tarjeta .cuerpo {
                font-style: italic;
                text-align: justify;
                padding: 8px;
            }

            .tarjeta .pie {
                background-color: lightgray;
                color: rgb(0, 0, 0);
                text-align: center;
                padding: 8px;
            }
        </style>
    </head>
    <body>
        <div class="tarjeta">
        <div class="titulo">Juan Pérez</div>
        <div class="cuerpo">Freelancer con alto nivel de competencias en el diseño y creación de sitios web.</div>
        <div class="pie">email: daw@example.com</div>
        </div>
    </body>
</html>
